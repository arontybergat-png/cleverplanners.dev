<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CleverPlanners – Vendor Login</title>
  <style>
    :root{
      --ink:#1e293b; --muted:#6b7280; --cream:#fbf6ed; --panel:#f4ecdc; --brand:#111827; --accent1:#ff7ab6; --accent2:#89f7d3; --ring:#e5dcc7; --radius:20px; --shadow:0 10px 30px rgba(16,24,40,.08);
      --ok:#16a34a; --warn:#f59e0b; --soft:#faf7f1;
      --bg:#fbf6ed;--text:#1e293b;--card:#fff;
    }
    *{box-sizing:border-box}
    html:focus-within{scroll-behavior:smooth}
    @media (prefers-reduced-motion: reduce){ html:focus-within{scroll-behavior:auto} }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;margin:0;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    :focus-visible{outline:2px solid var(--ring); outline-offset:2px; border-radius:10px}

    /* Header */
    header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(255,255,255,0.95);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(240,234,219,0.5);
    }
    .nav{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      max-width:1200px;
      margin:0 auto;
      padding:0 22px;
    }
    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      font-size:1.5rem;
      color:var(--brand);
      letter-spacing:-0.02em;
      text-decoration:none;
      transition:opacity 0.2s;
    }
    .logo:hover{
      opacity:0.9;
    }
    .brand-badge{
      width:28px;
      height:28px;
      border-radius:999px;
      background:#0b1320;
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:700;
      font-size:0.75rem;
    }

    /* Main Content */
    .login-container{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      min-height:calc(100vh - 56px);
    }
    .login-wrapper{
      max-width:500px;
      width:100%;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:50px 40px;
    }
    .login-header{
      text-align:center;
      margin-bottom:40px;
    }
    .login-title{
      font-size:2rem;
      font-weight:800;
      color:var(--ink);
      margin-bottom:8px;
    }
    .login-subtitle{
      color:var(--muted);
      font-size:1rem;
    }
    .form-group{
      margin-bottom:24px;
    }
    .form-label{
      display:block;
      font-weight:600;
      margin-bottom:8px;
      color:var(--ink);
      font-size:0.95rem;
    }
    .form-input{
      width:100%;
      padding:14px 16px;
      border:2px solid var(--ring);
      border-radius:8px;
      font-size:1rem;
      transition:all 0.3s;
      background:var(--card);
      color:var(--ink);
    }
    .form-input:focus{
      outline:none;
      border-color:var(--brand);
      box-shadow:0 0 0 3px rgba(17,24,39,0.1);
    }
    .form-checkbox{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:24px;
    }
    .form-checkbox input{
      width:18px;
      height:18px;
      cursor:pointer;
      accent-color:var(--brand);
    }
    .form-checkbox label{
      cursor:pointer;
      font-size:0.9rem;
      color:var(--muted);
    }
    .btn-primary{
      width:100%;
      padding:16px;
      background:var(--brand);
      color:#fff;
      border:none;
      border-radius:8px;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:all 0.3s;
      margin-bottom:16px;
    }
    .btn-primary:hover{
      background:#0a0f1a;
      transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(17,24,39,0.2);
    }
    .form-divider{
      text-align:center;
      margin:24px 0;
      position:relative;
      color:var(--muted);
      font-size:0.9rem;
    }
    .form-divider::before{
      content:'';
      position:absolute;
      top:50%;
      left:0;
      right:0;
      height:1px;
      background:var(--ring);
    }
    .form-divider span{
      background:var(--card);
      padding:0 16px;
      position:relative;
    }
    .form-footer{
      text-align:center;
      margin-top:24px;
      font-size:0.9rem;
      color:var(--muted);
    }
    .form-footer a{
      color:var(--brand);
      font-weight:600;
    }
    .form-footer a:hover{
      text-decoration:underline;
    }
    .error-message{
      background:#fee2e2;
      color:#991b1b;
      padding:12px 16px;
      border-radius:8px;
      margin-bottom:16px;
      font-size:0.9rem;
      display:none;
    }
    .error-message.show{
      display:block;
    }
    .signup-link{
      text-align:center;
      margin-top:24px;
      padding-top:24px;
      border-top:1px solid var(--ring);
    }
    .signup-link-text{
      color:var(--muted);
      font-size:0.95rem;
      margin-bottom:12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a href="index.html" class="logo">
        <span class="brand-badge">CP</span>
        CleverPlanners
      </a>
    </div>
  </header>

  <div class="login-container">
    <div class="login-wrapper">
      <div class="login-header">
        <h1 class="login-title">Vendor Portal</h1>
        <p class="login-subtitle">Sign in to manage your business profile</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <form id="vendorLoginForm">
        <div class="form-group">
          <label class="form-label" for="vendorEmail">Business Email</label>
          <input type="email" id="vendorEmail" class="form-input" placeholder="business@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="vendorPassword">Password</label>
          <input type="password" id="vendorPassword" class="form-input" placeholder="Enter your password" required>
        </div>
        <div class="form-checkbox">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
        <div class="form-footer">
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>
      </form>

      <div class="signup-link">
        <p class="signup-link-text">New to CleverPlanners?</p>
        <a href="vendor-intake.html" class="btn-primary" style="display:block;text-align:center">Create Vendor Account</a>
      </div>
    </div>
  </div>

  <script>
    // Login form
    document.getElementById('vendorLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('vendorEmail').value;
      const password = document.getElementById('vendorPassword').value;
      const errorMsg = document.getElementById('errorMessage');
      
      // Simple validation (in production, this would call an API)
      if (email && password) {
        // Simulate login
        localStorage.setItem('vendorLoggedIn', 'true');
        localStorage.setItem('vendorEmail', email);
        
        // Redirect to vendor dashboard
        window.location.href = 'vendor-dashboard.html';
      } else {
        errorMsg.textContent = 'Please enter both email and password';
        errorMsg.classList.add('show');
      }
    });

    // Forgot password
    document.getElementById('forgotPassword').addEventListener('click', (e) => {
      e.preventDefault();
      const email = prompt('Enter your business email to reset password:');
      if (email) {
        alert('Password reset link sent to ' + email);
      }
    });
  </script>
</body>
</html>
